name: Build Component
description: 
inputs:
  project_path:
    required: true
    type: string
  pack_project:
    required: false
    default: true
    type: boolean
  use_standard_zip:
    required: false
    default: true
    type: boolean
  compile_project:
    required: false
    default: true    
outputs: 
  project_path:
    value: ${{ inputs.project_path }}
  product_path:
    value: ${{ steps.build.outputs.product_path }} 
  startup_method:
    value: ${{ steps.build.outputs.startup_method }}
    
runs:
  using: "composite"
  steps:

  - name: get name
    id: get
    run: |
      fullname=${path##*/}
      name=${fullname%.*}
      echo "name=${name}" >> $GITHUB_OUTPUT
    shell: bash
    env:
      path: ${{ inputs.project_path }}

  - name: set mode
    id: mode
    run: |
      if [ "${compile_project}" = "false" ]; then
          echo "startup_method=component_source" >> $GITHUB_OUTPUT
      else
        if [ "${pack_project}" = "true" ]; then
          if [ "${use_standard_zip}" = "true" ]; then
            echo "startup_method=component_zip" >> $GITHUB_OUTPUT
          else
            echo "startup_method=component" >> $GITHUB_OUTPUT
          fi
        else
          echo "startup_method=component_project" >> $GITHUB_OUTPUT  
        fi      
      fi
    shell: bash
    env:
      pack_project: ${{ inputs.pack_project }}
      use_standard_zip: ${{ inputs.use_standard_zip }}
      
  - name: checkout compiler repo
    uses: actions/checkout@v4
    with:
      repository: miyako/4d-class-compiler
      path: compiler

  - name: build project
    id: build
    run: |
      tool4d.app/Contents/MacOS/tool4d ./compiler/Project/compiler.4DProject --skip-onstartup --startup-method="${STARTUP_METHOD}" --user-param="${PROJECT_PATH},${PWD}" --dataless
      echo "product_path=${GITHUB_WORKSPACE}/Components/${NAME}.4dbase" >> $GITHUB_OUTPUT
      echo "startup_method=${STARTUP_METHOD}" >> $GITHUB_OUTPUT 
    shell: bash     
    env: 
      PROJECT_PATH: ${{ inputs.project_path }}   
      NAME: ${{ steps.get.outputs.name }} 
      STARTUP_METHOD: ${{ steps.mode.outputs.startup_method }} 
